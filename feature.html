<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ir a Feature - Aprendé Git</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Ir a Feature</h1>
        <p>Entendé cómo cambiar a la rama feature</p>
        <nav>
            <ul>
                <li><a href="index.html">Volver al Inicio</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>¿Qué es Checkout?</h2>
            <p>Checkout cambia la rama actual o el commit en el que estás trabajando.</p>
            <p>Comando: <code>git checkout feature</code></p>
        </section>
        <section>
            <h2>Simulación</h2>
            <p>Cambia a la rama feature.</p>
            <button id="simulate-checkout-feature">Ir a Feature</button>
            <div class="visual" id="checkout-visual">
                <p>Rama actual: <span id="current-branch">main</span></p>
            </div>
        </section>
    </main>
    <footer>
        <p>Proyecto educativo - Git visual</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
